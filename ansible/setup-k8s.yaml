---
- name: Setup Docker and Kubernetes Cluster on Amazon Linux 2
  hosts: all
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"

  tasks:
    # -----------------------------
    # 1. Install Python3 (for Ansible)
    # -----------------------------
    - name: Ensure Python3 and pip3 are installed
      yum:
        name:
          - python3
          - python3-pip
        state: present

    # -----------------------------
    # 2. Install Docker
    # -----------------------------
    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: true

    # -----------------------------
    # 3. Install Kubernetes components
    # -----------------------------
    - name: Ensure /etc/yum.repos.d exists
      file:
        path: /etc/yum.repos.d
        state: directory

    - name: Add Kubernetes yum repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://packages.cloud.google.com/yum/doc/yum-key.gpg
                 https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

    - name: Install kubelet, kubeadm, kubectl
      yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        state: started
        enabled: true

- name: Initialize Kubernetes Master Node
  hosts: master
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"
  tasks:
    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --apiserver-advertise-address={{ ansible_host }}
      register: kubeadm_init
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Set kubeconfig for master node
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config

    - name: Install Flannel CNI
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Extract kubeadm join command
      shell: kubeadm token create --print-join-command
      register: kube_join_cmd

    - name: Set fact for kubeadm join command
      set_fact:
        kubeadm_join_command: "{{ kube_join_cmd.stdout }}"

- name: Join Worker Nodes to Cluster
  hosts: worker
  become: true
  tasks:
    - name: Join worker node to cluster
      shell: "{{ hostvars['master']['kubeadm_join_command'] }} --ignore-preflight-errors=all"
      args:
        creates: /etc/kubernetes/kubelet.conf
