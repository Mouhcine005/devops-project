stages:
  - build_and_push
  - deploy

variables:
  IMAGE_NAME: $DOCKER_USERNAME/devops-app:latest
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# -----------------------------
# 1. Build and Push Docker Image
# -----------------------------
build_and_push:
  stage: build_and_push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker info
    # Build the image using the Dockerfile inside your docker folder
    - docker build -t $IMAGE_NAME -f docker/Dockerfile .
    # Login and push in the same job
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push $IMAGE_NAME
  only:
    - main

# -----------------------------
# 2. Deploy / Update in Kubernetes Cluster
# -----------------------------
deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$MASTER_IP bash << EOF
        set -e
        export KUBECONFIG=/home/ec2-user/.kube/config
        kubectl set image deployment/devops-app devops-app=$IMAGE_NAME
        kubectl rollout status deployment/devops-app
      EOF
  only:
    - main