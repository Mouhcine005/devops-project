stages:
  - build_and_push
  - deploy

variables:
  IMAGE_NAME: $DOCKER_USERNAME/devops-app:latest
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# -----------------------------
# 1. Build and Push Docker Image
# -----------------------------
build_and_push:
  stage: build_and_push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker info
    # Build the image using the Dockerfile inside your docker folder
    - docker build -t $IMAGE_NAME -f docker/Dockerfile .
    # Login and push in the same job
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push $IMAGE_NAME
  only:
    - main

# -----------------------------
# 2. Deploy / Update in Kubernetes Cluster
# -----------------------------
deploy:
  stage: deploy
  image: lachlanevenson/k8s-kubectl:latest   # Prebuilt image with kubectl + bash + ssh
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$MASTER_IP bash << 'MASTER_EOF'
        ssh -o StrictHostKeyChecking=no $EC2_USER@$WORKER_PRIVATE_IP bash << 'WORKER_EOF'
          set -e
          export KUBECONFIG=/home/ec2-user/.kube/config
          kubectl set image -f /home/ec2-user/devops-project/kubernetes/deploy.yml devops-app=$IMAGE_NAME --record
          kubectl apply -f /home/ec2-user/devops-project/kubernetes/deploy.yml
        WORKER_EOF
      MASTER_EOF
  only:
    - main