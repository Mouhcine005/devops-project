<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — DevOps Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/theme.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-cube"></i>
                <span>DevOps</span>
            </div>
            <button class="sidebar-close" id="sidebarClose" onclick="toggleSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <span class="nav-section-title">Main</span>
                <a href="#" class="nav-item active" data-page="overview" onclick="navigate('overview', this)">
                    <i class="fas fa-th-large"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-page="users" onclick="navigate('users', this)">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-section-title">Infrastructure</span>
                <a href="#" class="nav-item" data-page="infrastructure" onclick="navigate('infrastructure', this)">
                    <i class="fas fa-server"></i>
                    <span>Infrastructure</span>
                </a>
                <a href="#" class="nav-item" data-page="pipeline" onclick="navigate('pipeline', this)">
                    <i class="fas fa-code-branch"></i>
                    <span>CI/CD Pipeline</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-section-title">System</span>
                <a href="#" class="nav-item" data-page="settings" onclick="navigate('settings', this)">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="user-details">
                    <span class="user-name" id="userName">Admin</span>
                    <span class="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content" id="mainContent">
        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="breadcrumb">
                    <span class="breadcrumb-item" id="pageTitle">Overview</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="topbar-status">
                    <span class="status-dot online"></span>
                    <span>System Online</span>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="btn btn-ghost btn-sm" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hide-mobile">Logout</span>
                </button>
            </div>
        </header>

        <!-- Page content container -->
        <div class="page-content" id="pageContent">
            <!-- Content loaded dynamically -->
        </div>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header" id="modalHeader"></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/pages.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
